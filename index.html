<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xúc Xắc Nảy & Dừng Phẳng Mặt</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            perspective: 2000px;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .dice-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            width: 90%;
            max-width: 1000px;
        }

        .dice-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
        }

        .cube {
            width: 100px;
            height: 100px;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out; /* Giúp lúc "khớp" mặt mượt hơn */
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            font-weight: bold;
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            backface-visibility: hidden; /* Chỉ hiện mặt trước */
        }

        /* Màu sắc & Vị trí mặt */
        .front  { transform: rotateY(0deg) translateZ(50px); background: #e74c3c; }
        .back   { transform: rotateY(180deg) translateZ(50px); background: #2ecc71; }
        .right  { transform: rotateY(90deg) translateZ(50px); background: #9b59b6; }
        .left   { transform: rotateY(-90deg) translateZ(50px); background: #f1c40f; }
        .top    { transform: rotateX(90deg) translateZ(50px); background: #3498db; }
        .bottom { transform: rotateX(-90deg) translateZ(50px); background: #e67e22; }

        .shadow {
            width: 80px;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            position: absolute;
            bottom: -30px;
            left: 10px;
            filter: blur(6px);
            transform: scale(1);
        }

        button {
            margin-top: 80px;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        button:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,0,0,0.5); }
        button:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="dice-grid" id="grid"></div>
    <button onclick="tossDices()">TUNG XÚC XẮC</button>

    <script>
        const grid = document.getElementById('grid');
        const dices = [];

        for (let i = 0; i < 6; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'dice-wrapper';
            wrapper.innerHTML = `
                <div class="cube">
                    <div class="face front">A</div>
                    <div class="face back">B</div>
                    <div class="face right">C</div>
                    <div class="face left">D</div>
                    <div class="face top">E</div>
                    <div class="face bottom">F</div>
                </div>
                <div class="shadow"></div>
            `;
            grid.appendChild(wrapper);
            dices.push({
                element: wrapper.querySelector('.cube'),
                shadow: wrapper.querySelector('.shadow'),
                y: 0, vy: 0,
                rx: 0, ry: 0, rz: 0, // Góc xoay hiện tại
                rvx: 0, rvy: 0, rvz: 0, // Vận tốc xoay
                isRolling: false
            });
        }

        function update() {
            let moving = false;
            const gravity = 0.9;
            const bounce = -0.55; // Độ nảy

            dices.forEach(d => {
                if (!d.isRolling) return;

                d.vy += gravity;
                d.y += d.vy;

                // Xoay tự do khi đang bay
                d.rx += d.rvx;
                d.ry += d.rvy;
                d.rz += d.rvz;

                if (d.y >= 0) {
                    d.y = 0;
                    d.vy *= bounce;

                    // Giảm tốc độ xoay khi chạm đất
                    d.rvx *= 0.7;
                    d.rvy *= 0.7;
                    d.rvz *= 0.7;

                    // Nếu lực nảy và tốc độ xoay đã yếu -> Dừng và làm phẳng mặt
                    if (Math.abs(d.vy) < 1.5) {
                        d.isRolling = false;
                        d.y = 0;
                        d.vy = 0;
                        snapToFace(d); // HÀM QUAN TRỌNG: Đưa về mặt phẳng
                    }
                }

                render(d);
                moving = true;
            });

            if (moving) requestAnimationFrame(update);
        }

        // Hàm đưa góc xoay về bội số của 90 để hiện rõ 1 mặt
        function snapToFace(d) {
            d.rx = Math.round(d.rx / 90) * 90;
            d.ry = Math.round(d.ry / 90) * 90;
            d.rz = Math.round(d.rz / 90) * 90;
            
            // Dùng transition CSS để khớp mặt mượt mà hơn trong 0.5s cuối
            d.element.style.transition = "transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            render(d);
        }

        function render(d) {
            d.element.style.transform = `translateY(${d.y}px) rotateX(${d.rx}deg) rotateY(${d.ry}deg) rotateZ(${d.rz}deg)`;
            
            const s = 1 - (Math.abs(d.y) / 400);
            d.shadow.style.transform = `scale(${Math.max(0.4, s)})`;
            d.shadow.style.opacity = Math.max(0.1, s);
        }

        function tossDices() {
            dices.forEach(d => {
                d.element.style.transition = "none"; // Tắt transition để vật lý hoạt động
                d.isRolling = true;
                d.y = -1;
                d.vy = -(Math.random() * 15 + 20); // Tung lên cao ngẫu nhiên
                
                // Tốc độ xoay hỗn loạn ban đầu
                d.rvx = (Math.random() - 0.5) * 30;
                d.rvy = (Math.random() - 0.5) * 30;
                d.rvz = (Math.random() - 0.5) * 30;
            });
            update();
        }

        tossDices(); // Chạy lần đầu
    </script>
</body>
</html>
