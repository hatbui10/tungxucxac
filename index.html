<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xúc Xắc 3D - Chữ Luôn Thẳng Đứng</title>
    <style>
        body {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; min-height: 100vh; background-color: #1a1a1a;
            margin: 0; perspective: 1500px; overflow: hidden; font-family: Arial, sans-serif;
        }
        .dice-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 60px; width: 90%; }
        .dice-wrapper { position: relative; width: 100px; height: 100px; transform-style: preserve-3d; }
        .cube { 
            width: 100px; height: 100px; position: absolute; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .face {
            position: absolute; width: 100px; height: 100px; display: flex;
            justify-content: center; align-items: center; font-size: 50px;
            font-weight: bold; color: white; border: 2px solid rgba(255,255,255,0.6);
            border-radius: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            backface-visibility: hidden;
        }
        .front  { transform: rotateY(0deg) translateZ(50px); background: #e74c3c; }
        .back   { transform: rotateY(180deg) translateZ(50px); background: #2ecc71; }
        .right  { transform: rotateY(90deg) translateZ(50px); background: #9b59b6; }
        .left   { transform: rotateY(-90deg) translateZ(50px); background: #f1c40f; }
        .top    { transform: rotateX(90deg) translateZ(50px); background: #3498db; }
        .bottom { transform: rotateX(-90deg) translateZ(50px); background: #e67e22; }

        .shadow {
            width: 80px; height: 10px; background: rgba(0,0,0,0.5);
            border-radius: 50%; position: absolute; bottom: -30px;
            left: 10px; filter: blur(6px); transition: opacity 0.2s;
        }
        button {
            margin-top: 100px; padding: 15px 40px; font-size: 20px;
            font-weight: bold; cursor: pointer; border-radius: 50px;
            border: none; background: #fff; color: #333; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="dice-grid" id="grid"></div>
    <button onclick="toss()">TUNG XÚC XẮC</button>

    <script>
        const grid = document.getElementById('grid');
        const dices = [];
        // Danh sách 6 hướng xoay cố định để mặt luôn thẳng đứng
        const safeRotations = [
            {x: 0, y: 0},    // Mặt A
            {x: 0, y: 180},  // Mặt B
            {x: 0, y: -90},  // Mặt C
            {x: 0, y: 90},   // Mặt D
            {x: -90, y: 0},  // Mặt E
            {x: 90, y: 0}    // Mặt F
        ];

        for (let i = 0; i < 6; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'dice-wrapper';
            wrapper.innerHTML = `<div class="cube"><div class="face front">A</div><div class="face back">B</div><div class="face right">C</div><div class="face left">D</div><div class="face top">E</div><div class="face bottom">F</div></div><div class="shadow"></div>`;
            grid.appendChild(wrapper);
            dices.push({
                el: wrapper.querySelector('.cube'),
                sh: wrapper.querySelector('.shadow'),
                y: 0, vy: 0, rx: 0, ry: 0, rz: 0, rvx: 0, rvy: 0, rvz: 0, rolling: false
            });
        }

        function update() {
            let moving = false;
            dices.forEach(d => {
                if (!d.rolling) return;
                
                d.vy += 0.8; 
                d.y += d.vy;
                d.rx += d.rvx; d.ry += d.rvy; d.rz += d.rvz;

                if (d.y >= 0) {
                    d.y = 0;
                    d.vy *= -0.5; 
                    d.rvx *= 0.7; d.rvy *= 0.7; d.rvz *= 0.7;

                    if (Math.abs(d.vy) < 1.5) {
                        d.rolling = false;
                        d.y = 0; d.vy = 0;
                        
                        // CHỌN MẶT NGẪU NHIÊN VÀ ÉP THẲNG HÀNG
                        const result = safeRotations[Math.floor(Math.random() * safeRotations.length)];
                        d.rx = result.x;
                        d.ry = result.y;
                        d.rz = 0; 
                        
                        d.el.style.transition = "transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                    }
                }
                render(d);
                moving = true;
            });
            if (moving) requestAnimationFrame(update);
        }

        function render(d) {
            d.el.style.transform = `translateY(${d.y}px) rotateX(${d.rx}deg) rotateY(${d.ry}deg) rotateZ(${d.rz}deg)`;
            const s = 1 - (Math.abs(d.y) / 400);
            d.sh.style.transform = `scale(${Math.max(0.4, s)})`;
            d.sh.style.opacity = Math.max(0.1, s);
        }

        function toss() {
            dices.forEach(d => {
                d.el.style.transition = "none";
                d.rolling = true;
                d.vy = -(Math.random() * 15 + 20);
                d.rvx = (Math.random() - 0.5) * 40;
                d.rvy = (Math.random() - 0.5) * 40;
                d.rvz = (Math.random() - 0.5) * 40;
            });
            update();
        }
        toss();
    </script>
</body>
</html>
