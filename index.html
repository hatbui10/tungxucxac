<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xúc Xắc Nảy - Chữ Luôn Đúng Chiều (Fix Lộn)</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            perspective: 1500px;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .dice-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            width: 90%;
        }

        .dice-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
        }

        .cube {
            width: 100px;
            height: 100px;
            position: absolute;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: white;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            backface-visibility: hidden;
        }

        /* Thẻ span để điều khiển hướng chữ độc lập với khối hộp */
        .face span {
            display: inline-block;
            transition: transform 0.5s ease-in-out;
        }

        /* Các mặt ABCDEF */
        .front  { transform: rotateY(0deg) translateZ(50px); background: #e74c3c; }
        .back   { transform: rotateY(180deg) translateZ(50px); background: #2ecc71; }
        .right  { transform: rotateY(90deg) translateZ(50px); background: #9b59b6; }
        .left   { transform: rotateY(-90deg) translateZ(50px); background: #f1c40f; }
        .top    { transform: rotateX(90deg) translateZ(50px); background: #3498db; }
        .bottom { transform: rotateX(-90deg) translateZ(50px); background: #e67e22; }

        .shadow {
            width: 80px;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            position: absolute;
            bottom: -30px;
            left: 10px;
            filter: blur(6px);
        }

        button {
            margin-top: 100px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            background: #fff;
            color: #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="dice-grid" id="grid"></div>
    <button onclick="toss()">TUNG XÚC XẮC</button>

    <script>
        const grid = document.getElementById('grid');
        const dices = [];

        // Tạo 6 khối hộp với thẻ span bên trong mặt
        for (let i = 0; i < 6; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'dice-wrapper';
            wrapper.innerHTML = `
                <div class="cube">
                    <div class="face front"><span>A</span></div>
                    <div class="face back"><span>B</span></div>
                    <div class="face right"><span>C</span></div>
                    <div class="face left"><span>D</span></div>
                    <div class="face top"><span>E</span></div>
                    <div class="face bottom"><span>F</span></div>
                </div>
                <div class="shadow"></div>`;
            grid.appendChild(wrapper);
            dices.push({
                el: wrapper.querySelector('.cube'),
                sh: wrapper.querySelector('.shadow'),
                y: 0, vy: 0, rx: 0, ry: 0, rz: 0, rvx: 0, rvy: 0, rvz: 0, rolling: false
            });
        }

        function update() {
            let moving = false;
            dices.forEach(d => {
                if (!d.rolling) return;
                
                d.vy += 0.8; // Trọng lực
                d.y += d.vy;
                d.rx += d.rvx; d.ry += d.rvy; d.rz += d.rvz;

                if (d.y >= 0) {
                    d.y = 0;
                    d.vy *= -0.5; // Độ nảy
                    d.rvx *= 0.7; d.rvy *= 0.7; d.rvz *= 0.7;

                    if (Math.abs(d.vy) < 1.5) {
                        d.rolling = false;
                        
                        // 1. Khóa góc khối hộp về bội số 90
                        d.rx = Math.round(d.rx / 90) * 90;
                        d.ry = Math.round(d.ry / 90) * 90;
                        d.rz = 0; 

                        // 2. Logic sửa hướng chữ:
                        const spans = d.el.querySelectorAll('.face span');
                        // Chuẩn hóa góc về 0-360 để dễ tính toán
                        const normRX = ((d.rx % 360) + 360) % 360;
                        const normRY = ((d.ry % 360) + 360) % 360;

                        spans.forEach(span => {
                            // Reset về mặc định
                            span.style.transform = "rotate(0deg)";
                            
                            // Nếu mặt sau lộ ra (Y=180) hoặc lật Top/Bottom (X=90/270), 
                            // chữ thường bị ngược Ǝ, Ⅎ... Ta xoay 180 độ để sửa lại.
                            if (normRY === 180 || normRX === 90 || normRX === 270) {
                                span.style.transform = "rotate(180deg)";
                            }
                        });

                        d.el.style.transition = "transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                    }
                }
                render(d);
                moving = true;
            });
            if (moving) requestAnimationFrame(update);
        }

        function render(d) {
            d.el.style.transform = `translateY(${d.y}px) rotateX(${d.rx}deg) rotateY(${d.ry}deg) rotateZ(${d.rz}deg)`;
            const s = 1 - (Math.abs(d.y) / 400);
            d.sh.style.transform = `scale(${Math.max(0.4, s)})`;
            d.sh.style.opacity = Math.max(0.1, s);
        }

        function toss() {
            dices.forEach(d => {
                // Reset hướng chữ về 0 trước khi tung mới để tránh lỗi quay ngược giữa chừng
                d.el.querySelectorAll('span').forEach(s => s.style.transform = "rotate(0deg)");
                
                d.el.style.transition = "none";
                d.rolling = true;
                d.vy = -(Math.random() * 15 + 20);
                d.rvx = (Math.random() - 0.5) * 40;
                d.rvy = (Math.random() - 0.5) * 40;
                d.rvz = (Math.random() - 0.5) * 40;
            });
            update();
        }

        // Tự động tung lần đầu
        toss();
    </script>
</body>
</html>
